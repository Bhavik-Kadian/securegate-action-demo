name: secret-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read          # read the code
  pull-requests: write    # post SecureGate's comment
  security-events: write  # send the findings to the Security tab

jobs:
  secret-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # every commit of the pull request
          persist-credentials: false
      - uses: Bhavik-Kadian/Nexora@adf8ab6d3d939ef6b77f9ef24d7d634fdf815fc6 # the close-out pull request, before the v1.0.0 tag
